name: Limpiar publicacion temporal de Transcripcion 2026

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-onefile.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Eliminar release y tag temporal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete transcripcion-2026-v1 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

      - name: Eliminar artefactos temporales de transcripcion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" --paginate --jq '.artifacts[] | select(.name | startswith("Transcripcion_2026")) | .id' | while read id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
          done
