name: Construir Transcripcion 2026 EXE unico

on:
  push:
    branches: [main]
    paths:
      - "Transcripcion_2026.py"
      - "requirements-build.txt"
      - ".github/workflows/build-onefile.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar herramientas de compilacion
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-build.txt

      - name: Descargar modelo Whisper small para uso sin internet
        shell: pwsh
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='Systran/faster-whisper-small', local_dir=r'modelos\small')"
          if (-not (Test-Path "modelos\small\model.bin")) { throw "No se descargo model.bin" }

      - name: Construir un solo EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --noupx `
            --name Transcripcion_2026 `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all tokenizers `
            --collect-all av `
            --collect-all imageio_ffmpeg `
            --add-data "modelos\small;modelos\small" `
            Transcripcion_2026.py

      - name: Probar el EXE generado
        shell: pwsh
        run: |
          & ".\dist\Transcripcion_2026.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "La autoprueba del EXE fallo" }
          $hash = (Get-FileHash ".\dist\Transcripcion_2026.exe" -Algorithm SHA256).Hash.ToLower()
          $tamano = (Get-Item ".\dist\Transcripcion_2026.exe").Length
          "$hash  Transcripcion_2026.exe" | Set-Content -Encoding ascii ".\dist\SHA256.txt"
          Write-Host "Tamano del EXE: $tamano bytes"
          Write-Host "SHA256: $hash"

      - name: Dividir temporalmente para transferencia
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path parts | Out-Null
          $source = ".\dist\Transcripcion_2026.exe"
          $partSize = 209715200
          $input = [System.IO.File]::OpenRead($source)
          try {
            $buffer = New-Object byte[] $partSize
            $index = 1
            while (($read = $input.Read($buffer, 0, $buffer.Length)) -gt 0) {
              $part = ".\parts\Transcripcion_2026.exe.part{0:D2}" -f $index
              $output = [System.IO.File]::Create($part)
              try { $output.Write($buffer, 0, $read) } finally { $output.Dispose() }
              $index++
            }
          } finally { $input.Dispose() }
          Copy-Item ".\dist\SHA256.txt" ".\parts\SHA256.txt"
          Get-ChildItem .\parts | Format-Table Name,Length

      - name: Publicar parte 1
        uses: actions/upload-artifact@v4
        with:
          name: Transcripcion_2026_PARTE_01
          path: parts/Transcripcion_2026.exe.part01
          compression-level: 0
          retention-days: 30

      - name: Publicar parte 2
        uses: actions/upload-artifact@v4
        with:
          name: Transcripcion_2026_PARTE_02
          path: parts/Transcripcion_2026.exe.part02
          compression-level: 0
          retention-days: 30

      - name: Publicar parte 3
        uses: actions/upload-artifact@v4
        with:
          name: Transcripcion_2026_PARTE_03
          path: |
            parts/Transcripcion_2026.exe.part03
            parts/SHA256.txt
          compression-level: 0
          retention-days: 30
